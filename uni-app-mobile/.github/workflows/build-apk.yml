name: Build UniApp APK

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'uni-app-mobile/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'uni-app-mobile/**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./uni-app-mobile
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/uni-app-mobile/**/*.gradle*', '**/uni-app-mobile/**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Install dependencies
      run: |
        npm ci --legacy-peer-deps || npm install --legacy-peer-deps
        
    - name: Build UniApp
      run: |
        npm run build:app
        
    - name: Copy resources to Android project
      run: |
        rm -rf android-project/app/src/main/assets/apps/__UNI__F311F19/www
        mkdir -p android-project/app/src/main/assets/apps/__UNI__F311F19/www
        cp -r dist/build/app/* android-project/app/src/main/assets/apps/__UNI__F311F19/www/
        
    - name: Build APK
      working-directory: ./android-project
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon
      env:
        ANDROID_HOME: ${{ env.ANDROID_HOME }}
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: juju-app-release
        path: android-project/app/build/outputs/apk/release/*.apk
        retention-days: 30
        
    - name: Upload APK to server (main/master only)
      if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && env.SSH_PRIVATE_KEY != ''
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H 122.51.255.13 >> ~/.ssh/known_hosts
        scp android-project/app/build/outputs/apk/release/*.apk ubuntu@122.51.255.13:/var/www/html/download/juju-app-latest.apk
