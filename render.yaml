services:
  - type: web
    name: juju-backend
    runtime: node
    plan: free
    branch: backup-auto-20260331-210742
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: APP_HOST
        value: 0.0.0.0
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: 6379
      - key: REDIS_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: WECHAT_PAY_APPID
        sync: false
      - key: WECHAT_PAY_MCHID
        sync: false
      - key: WECHAT_PAY_API_V3_KEY
        sync: false
      - key: WECHAT_APP_ID
        sync: false
      - key: WECHAT_APP_SECRET
        sync: false
      - key: ALIPAY_APPID
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGIN
        value: https://hfparty.asia
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 1000
    healthCheckPath: /health
    autoDeploy: true
