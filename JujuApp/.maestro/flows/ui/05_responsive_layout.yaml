# UI Test: Responsive Layout
# Check layout adapts to different content sizes

appId: com.jujuapp
name: Responsive Layout
---
- launchApp
- waitForAnimationToEnd:
    timeout: 3000

# 检查长文本处理
- tapOn:
    id: "tab-profile"
    optional: true

- waitForAnimationToEnd

# 截图个人中心（检查布局）
- takeScreenshot: ui_layout_profile

# 滚动检查
- scroll
- waitForAnimationToEnd

- takeScreenshot: ui_layout_scrolled

# 返回首页
- tapOn:
    id: "tab-home"
    optional: true
