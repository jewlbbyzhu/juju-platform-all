# UI Screenshot Audit - 关键页面截图走查
# 覆盖: 启动页、登录页、首页、聚会详情、个人中心、VIP页面、票券页

appId: com.jujuapp
name: UI Screenshot Audit
---
# ========== 阶段1: 启动页 ==========
- launchApp
- waitForAnimationToEnd:
    timeout: 3000

# 截图：启动页
- takeScreenshot: 01_launch_screen

# ========== 阶段2: 登录页 ==========
# 尝试找到登录按钮或输入框
- tapOn:
    text: "登录"
    optional: true

- waitForAnimationToEnd:
    timeout: 2000

# 截图：登录页
- takeScreenshot: 02_login_screen

# 尝试填写测试账号（如有输入框）
- tapOn:
    id: "phone-input"
    optional: true

- inputText:
    text: "13800138000"
    optional: true

- tapOn:
    id: "password-input"
    optional: true

- inputText:
    text: "test123456"
    optional: true

# 截图：登录页填写状态
- takeScreenshot: 02_login_filled

# 点击登录按钮
- tapOn:
    text: "登录"
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

# 截图：登录后状态
- takeScreenshot: 02_after_login_attempt

# ========== 阶段3: 首页 ==========
- waitForAnimationToEnd:
    timeout: 3000

# 截图：首页
- takeScreenshot: 03_home_screen

# 验证关键元素
- assertVisible:
    text: "JUJU"
    optional: true

- assertVisible:
    text: "搜索"
    optional: true

# ========== 阶段4: 聚会详情页 ==========
# 点击第一个聚会卡片
- tapOn:
    point: 50%,45%
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

# 截图：聚会详情页
- takeScreenshot: 04_party_detail_screen

# 返回
- back

- waitForAnimationToEnd:
    timeout: 2000

# ========== 阶段5: 票券页 ==========
# 点击底部Tab - 票券（假设是第二个Tab）
- tapOn:
    point: 35%,95%
    optional: true

- waitForAnimationToEnd:
    timeout: 2000

# 截图：票券页
- takeScreenshot: 05_my_tickets_screen

# ========== 阶段6: VIP页面 ==========
# 尝试点击VIP入口
- tapOn:
    text: "VIP"
    optional: true

- waitForAnimationToEnd:
    timeout: 2000

# 如果没有找到VIP文字，尝试返回首页再找
- runFlow:
    when:
      notVisible: "VIP会员"
    commands:
      - back
      - waitForAnimationToEnd:
          timeout: 1000
      - tapOn:
          point: 50%,45%
          optional: true

- waitForAnimationToEnd:
    timeout: 2000

# 截图：VIP页面
- takeScreenshot: 06_vip_center_screen

# ========== 阶段7: 个人中心 ==========
# 点击最后一个Tab（个人中心）
- tapOn:
    point: 85%,95%
    optional: true

- waitForAnimationToEnd:
    timeout: 2000

# 截图：个人中心
- takeScreenshot: 07_user_profile_screen

# 尝试查找设置按钮
- tapOn:
    text: "设置"
    optional: true

- waitForAnimationToEnd:
    timeout: 2000

# 截图：设置页
- takeScreenshot: 08_settings_screen

# 返回
- back

- waitForAnimationToEnd:
    timeout: 1000

# 截图：个人中心（返回后）
- takeScreenshot: 09_profile_final
