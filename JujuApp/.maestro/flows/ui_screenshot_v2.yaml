# JUJU UI 截图走查测试 v2
# 使用更简单的方式获取关键页面截图

appId: com.jujuapp
name: JUJU UI Screenshot Audit v2
---
# 1. 启动页截图
- launchApp:
    clearState: true
    stopApp: false
- extendedWaitUntil:
    visible: ".*"
    timeout: 5000
- takeScreenshot: ~/.maestro/tests/latest/01_launch_screen

# 2. 首页截图
- waitForAnimationToEnd
- takeScreenshot: ~/.maestro/tests/latest/03_home_screen

# 3. 发现/票券页（Tab 2）
- tapOn:
    point: 54%,96%
- waitForAnimationToEnd
- takeScreenshot: ~/.maestro/tests/latest/05_my_tickets_screen

# 4. 聚会页（Tab 3）
- tapOn:
    point: 63%,96%
- waitForAnimationToEnd
- takeScreenshot: ~/.maestro/tests/latest/04_party_detail_screen

# 5. VIP/消息页（Tab 4）
- tapOn:
    point: 72%,96%
- waitForAnimationToEnd
- takeScreenshot: ~/.maestro/tests/latest/06_vip_center_screen

# 6. 我的页面（Tab 5）
- tapOn:
    point: 90%,96%
- waitForAnimationToEnd
- takeScreenshot: ~/.maestro/tests/latest/07_user_profile_screen

# 7. 返回首页
- tapOn:
    point: 10%,96%
- waitForAnimationToEnd
- takeScreenshot: ~/.maestro/tests/latest/08_back_to_home

# 测试完成
- stopApp