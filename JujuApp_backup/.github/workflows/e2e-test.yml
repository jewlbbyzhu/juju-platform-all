name: E2E UI Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  e2e-android:
    runs-on: macos-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Install Android Emulator
      run: |
        sdkmanager "system-images;android-36;google_apis;x86_64"
        echo "no" | avdmanager create avd -n test_device -k "system-images;android-36;google_apis;x86_64" --force
        
    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease
        
    - name: Start Emulator
      run: |
        emulator -avd test_device -no-window -no-audio -no-boot-anim &
        adb wait-for-device
        adb shell input keyevent 82
        
    - name: Run E2E Tests
      run: |
        python e2e_test/run_tests.py
        
    - name: Upload Test Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-test-report
        path: e2e_test/reports/
        
    - name: Upload Screenshots
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-screenshots
        path: e2e_test/*.png
