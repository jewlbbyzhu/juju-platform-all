# Test: Home Screen Navigation - UI Modernization v2.0
# Tests: 瀑布流布局、分类筛选、卡片点击

appId: com.jujuapp
name: Home Navigation
---
# 启动应用
- launchApp
- waitForAnimationToEnd:
    timeout: 3000

# 截图：首页初始状态
- takeScreenshot: 03_home_initial

# 验证搜索栏存在
- assertVisible:
    text: "搜索"
    optional: true

# 点击分类标签 - "派对"
- tapOn:
    text: "派对"
    optional: true

- waitForAnimationToEnd:
    timeout: 2000

# 截图：分类筛选后
- takeScreenshot: 03_home_party_category

# 点击 "音乐" 分类
- tapOn:
    text: "音乐"
    optional: true

- waitForAnimationToEnd:
    timeout: 2000

# 截图：音乐分类
- takeScreenshot: 03_home_music_category

# 返回"全部"
- tapOn:
    text: "全部"
    optional: true

- waitForAnimationToEnd:
    timeout: 2000

# 尝试点击第一个聚会卡片（使用坐标或文本匹配）
- tapOn:
    point: 25%,40%
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

# 截图：可能的详情页
- takeScreenshot: 03_party_detail_or_error

# 返回（如果进入了详情页）
- back
