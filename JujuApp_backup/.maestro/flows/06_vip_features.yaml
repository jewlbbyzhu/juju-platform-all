# Test: VIP Features - UI Modernization v2.0
# Tests: VIP页面、会员功能

appId: com.jujuapp
name: VIP Features
---
- launchApp
- waitForAnimationToEnd:
    timeout: 3000

# 导航到个人中心Tab
- tapOn:
    point: 85%,95%
    optional: true

- waitForAnimationToEnd:
    timeout: 2000

# 截图：个人中心
- takeScreenshot: 06_profile_screen

# 尝试点击VIP入口
- tapOn:
    text: "VIP"
    optional: true

- tapOn:
    text: "会员"
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

# 截图：VIP页面
- takeScreenshot: 06_vip_screen
