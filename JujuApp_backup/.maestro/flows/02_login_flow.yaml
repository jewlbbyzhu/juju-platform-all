# Test: Login Flow - UI Modernization v2.0
# Tests: 登录表单、输入验证

appId: com.jujuapp
name: Login Flow
---
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 3000

# 截图：登录页
- takeScreenshot: 02_login_screen

# 尝试输入手机号（如果登录页出现）
- tapOn:
    text: "手机号"
    optional: true

- inputText:
    text: "13800138000"
    optional: true

# 尝试输入密码
- tapOn:
    text: "密码"
    optional: true

- inputText:
    text: "test123456"
    optional: true

# 截图：填写后
- takeScreenshot: 02_login_filled

# 尝试点击登录（如果存在）
- tapOn:
    text: "登录"
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

# 截图：登录后状态
- takeScreenshot: 02_after_login_attempt
