# JUJU UI 截图走查测试
# 生成关键页面截图用于UI走查

appId: com.jujuapp
name: JUJU UI Screenshot Audit
---
# 1. 启动页截图
- launchApp:
    clearState: true
    stopApp: true
- takeScreenshot: ~/.maestro/tests/latest/01_launch_screen

# 2. 登录页截图
- waitForAnimationToEnd
- tapOn: "手机号"
- inputText: "13800138000"
- tapOn: "验证码"
- inputText: "123456"
- takeScreenshot: ~/.maestro/tests/latest/02_login_screen

# 3. 首页截图 - 模拟登录
- tapOn: "登录"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "首页"
    timeout: 10000
- takeScreenshot: ~/.maestro/tests/latest/03_home_screen

# 4. 聚会详情页截图
- tapOn: ".*聚会.*"
- waitForAnimationToEnd
- takeScreenshot: ~/.maestro/tests/latest/04_party_detail_screen

# 5. 票券页截图
- tapOn: "票券"
- waitForAnimationToEnd
- takeScreenshot: ~/.maestro/tests/latest/05_my_tickets_screen

# 6. VIP中心截图
- tapOn: "VIP"
- waitForAnimationToEnd
- takeScreenshot: ~/.maestro/tests/latest/06_vip_center_screen

# 7. 个人中心截图
- tapOn: "我的"
- waitForAnimationToEnd
- takeScreenshot: ~/.maestro/tests/latest/07_user_profile_screen

# 8. 设置页截图
- tapOn: "设置"
- waitForAnimationToEnd
- takeScreenshot: ~/.maestro/tests/latest/08_settings_screen

# 测试完成
- stopApp