# UI Test: Component Consistency Check
# Verify UI components render correctly

appId: com.jujuapp
name: Component Consistency
---
- launchApp
- waitForAnimationToEnd:
    timeout: 3000

# 检查按钮样式一致性
- tapOn:
    id: "create-party-button"
    optional: true

- waitForAnimationToEnd

# 截图表单页面
- takeScreenshot: ui_form_components

# 检查输入框
- assertVisible:
    id: "party-title-input"
    optional: true

# 检查选择器
- tapOn:
    id: "party-type-selector"
    optional: true

- waitForAnimationToEnd

# 截图选择器弹窗
- takeScreenshot: ui_picker_component

# 关闭选择器
- tapOn:
    text: "取消"
    optional: true
- tapOn:
    text: "关闭"
    optional: true
