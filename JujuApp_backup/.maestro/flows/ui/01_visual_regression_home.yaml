# UI Test: Visual Regression - Home Screen
# Verify UI consistency across runs

appId: com.jujuapp
name: Visual Regression - Home Screen
---
- launchApp
- waitForAnimationToEnd:
    timeout: 3000

# 截图首页（用于视觉对比）
- takeScreenshot: ui_home_baseline

# 检查关键UI元素存在
- assertVisible:
    text: "发现精彩聚会"
    optional: true

# 检查底部Tab栏
- assertVisible:
    id: "tab-home"
    optional: true
- assertVisible:
    id: "tab-orders"
    optional: true
- assertVisible:
    id: "tab-tickets"
    optional: true
- assertVisible:
    id: "tab-profile"
    optional: true

# 检查首页核心组件
- assertVisible:
    id: "search-input"
    optional: true
