# UI Test: Dark Mode Support
# Verify app handles dark mode

appId: com.jujuapp
name: Dark Mode Support
---
- launchApp
- waitForAnimationToEnd:
    timeout: 3000

# 截图正常模式
- takeScreenshot: ui_light_mode_home

# 尝试切换到深色模式（通过系统设置）
- evalScript: |
    // 注意：Maestro无法直接切换系统主题
    // 这里检查应用是否响应系统主题变化
    console.log('UI_THEME_CHECK: Light mode screenshot taken');

# 检查文本对比度（在正常模式下）
- assertVisible:
    text: "发现精彩聚会"
    optional: true
